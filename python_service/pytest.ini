[pytest]
# Pytest configuration for forensics project Python service tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    integration: Integration tests (require Neo4j and other services)
    unit: Unit tests (fast, isolated)
    slow: Slow tests (take more than 1 second)
    concurrency: Tests whose primary invariant is concurrent execution or lifecycle ordering
    migration_matrix: Tests covering historical schema upgrades, rollback, or version compatibility
    asyncio: Async tests (require pytest-asyncio)

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    # --cov=python_service  # Uncomment for coverage
    # --cov-report=html  # Uncomment for HTML coverage report

# Asyncio mode
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    # Ignore specific warnings
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
