projects:
  - libnbd

gitlab:
  namespace: nbdkit
  project: libnbd
  jobs:
    check-dco: false

targets:
  alpine-322: x86_64

  alpine-323: x86_64

  alpine-edge: x86_64

  almalinux-9: x86_64

  almalinux-10: x86_64

  centos-stream-9: x86_64

  debian-12:
    jobs:
      - arch: x86_64
      - arch: i686

  debian-13:
    jobs:
      - arch: x86_64
      - arch: i686

  debian-sid: x86_64

  fedora-43: x86_64

  fedora-44: x86_64

  fedora-rawhide:
    jobs:
      - arch: x86_64

      - arch: x86_64
        suffix: -clang
        variables:
          CC: clang

      - arch: x86_64
        suffix: -no-libxml2
        variables:
          LIBXML2: skip

  opensuse-leap-15: x86_64

  opensuse-tumbleweed: x86_64

  ubuntu-2404:
    jobs:
      - arch: x86_64
        variables:
          RUST: skip

  ubuntu-2604:
    jobs:
      - arch: x86_64
        variables:
          RUST: skip
